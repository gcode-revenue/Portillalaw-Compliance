# Blueprint de Render: https://render.com/docs/blueprint-spec
# Render → New → Blueprint → seleccionar este repositorio.
services:
  - type: web
    name: portilla-portal
    runtime: node
    plan: starter            # necesario para disco persistente (la base de datos)
    region: virginia         # la región más cercana a Puerto Rico
    branch: claude/zen-sagan-cs6nzu
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/portilla.db
      - key: APP_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_TZ
        value: America/Puerto_Rico
      - key: APP_URL
        value: https://portal.portillalaw.com
      # Cuenta del presidente (se crea sola en el primer arranque)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        sync: false
      # Email (SMTP)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: "Portilla Law Cumplimiento <cumplimiento@portillalaw.com>"
      # SMS (Twilio)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
