# Blueprint de Render: https://render.com/docs/blueprint-spec
# Render → New → Blueprint → seleccionar este repositorio.
services:
  - type: web
    name: portilla-portal
    runtime: node
    plan: starter            # necesario para disco persistente (la base de datos)
    region: virginia         # la región más cercana a Puerto Rico
    branch: claude/zen-sagan-cs6nzu
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/portilla.db
      - key: APP_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_TZ
        value: America/Puerto_Rico
      - key: APP_URL
        value: https://portal.portillalaw.com
      # Cuenta del presidente (se crea sola en el primer arranque)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        sync: false
      # Email: Microsoft 365 vía Microsoft Graph (registro de aplicación en Entra ID)
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_SENDER
        value: cumplimiento@portillalaw.com
      # SMS: Heymarket (Settings > Integrations > API)
      - key: HEYMARKET_SECRET_ID
        sync: false
      - key: HEYMARKET_SECRET_KEY
        sync: false
      - key: HEYMARKET_INBOX_ID
        sync: false
      - key: HEYMARKET_CREATOR_ID
        sync: false
      - key: HEYMARKET_WEBHOOK_TOKEN
        generateValue: true
      # WhatsApp Cloud API (Meta)
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE
        value: aviso_portilla
      - key: WHATSAPP_TEMPLATE_LANG
        value: es
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      # Asistencia automática de Zoom (app Server-to-Server OAuth)
      - key: ZOOM_ACCOUNT_ID
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
